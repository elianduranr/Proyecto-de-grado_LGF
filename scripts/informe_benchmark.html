font-weight:600}th button{border:0;background:transparent;padding:0;font-size:12px;font-weight:600;white-space:nowrap}td.text,th.text{text-align:left}tbody tr:hover{background:#f5f8f5}.negative{color:var(--red)}.positive{color:var(--green)}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}.table-search{padding:8px 10px;border:1px solid var(--line);border-radius:6px;min-width:240px}select{padding:7px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink)}.empty{padding:35px;text-align:center;color:var(--muted)}.method{display:grid;grid-template-columns:190px 1fr;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.footer{margin-top:24px;font-size:11px;color:var(--muted);overflow-wrap:anywhere}.pill{background:#e6f2eb;border-radius:20px;padding:4px 10px;font-size:11px;color:#235645}.week-controls{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.week-controls input{width:65px;padding:4px;border:1px solid var(--line)}

<body>
<header><div><div class="eyebrow">LGF / Planeación y producción</div><h1>¿Cuánto se desvía el estimado?</h1><p>Benchmark H1 · Informe para gerencia</p></div><div class="export-links"><a href="informe_gerencia_benchmark.xlsx" download>Descargar Excel · periodo completo</a><p id="source-date"></p></div></header>
<main class="shell">
<section class="filters" aria-label="Filtros del informe"><div class="toolbar"><div><strong>Selecciona el alcance del análisis</strong><div class="muted">Los filtros se aplican a todas las pestañas. Puedes elegir varias semanas o categorías.</div></div><button id="reset">Restablecer filtros</button></div><div class="filter-grid" id="filters"></div><div class="options"><label><input type="checkbox" id="include-recovered" checked> Incluir uniones por variedad</label><label><input type="checkbox" id="complete-only"> Solo semanas completas según control guardado</label><span class="pill">Errores calculados al detalle semanal</span></div></section>

<script id="report-data" type="application/json">__BENCHMARK_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const number=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const decimal=new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=(n,d=false)=>n===null||n===undefined||!Number.isFinite(n)?'—':(d?decimal:number).format(n);
const dims={anio:'Año',semana:'Semana',k_finca:'Finca',k_producto:'Producto',k_color:'Color',k_variedad:'Variedad'};
const labels={...dims,estado:'Estado',registros:'Registros',comparaciones:'Comparaciones',por_revisar:'Cantidades por revisar',tallos_estimados:'Estimado · tallos',tallos_reales:'Real · tallos',diferencia_tallos:'Diferencia · tallos',error_absoluto_total:'Error absoluto · tallos',MAE_tallos:'MAE · tallos',WAPE_pct:'WAPE %',sesgo_pct:'Sesgo %',participacion_error_pct:'Aporte al error %',sobreestimacion_tallos:'Sobreestimación · tallos',subestimacion_tallos:'Subestimación · tallos',solo_estimado:'Solo estimado · registros',solo_produccion:'Solo producción · registros',sin_contraparte_con_volumen:'Sin contraparte con volumen',sin_contraparte_cero:'Sin contraparte con cero',unido_variedad:'Unidos por variedad',tallos_estimados_original:'Estimado original',tallos_reales_original:'Real original',cero_estimado_por_union:'Cero estimado por unión',cero_real_por_union:'Cero real por unión',cantidad_por_revisar:'Cantidad por revisar',error_absoluto:'Error absoluto · tallos',estado_semana:'Control de semana',fechas_faltantes:'Fechas por revisar',dias_con_produccion:'Días con producción',dias_faltantes_lunes_sabado:'Días ausentes lun–sáb'};
const stateLabels={coincide:'Coincidencia estricta',unido_variedad:'Unión sin comparar color',solo_estimado:'Solo estimado',solo_produccion:'Solo producción'};
const tabs=[['resumen','Resumen ejecutivo'],['semanas','Evolución semanal'],['fincas','Por finca'],['productos','Por producto'],['colores','Por color'],['variedades','Por variedad'],['detalle','Detalle y cobertura'],['metodo','Metodología']];
const control=new Map(DATA.control.map(r=>[`${r.anio}-${r.semana}`,r]));
const state={selected:{},tab:'resumen',includeRecovered:true,completeOnly:false,search:'',sort:'error_absoluto_total',desc:true,page:0,metric:'error_absoluto_total',cross:'principal'};
let currentRows=[],currentTable=[],currentColumns=[];
for(const key of Object.keys(dims))state.selected[key]=new Set();
function values(key){return [...new Set(DATA.rows.map(r=>r[key]))].sort((a,b)=>typeof a==='number'?a-b:String(a).localeCompare(String(b),'es'));}
function buildFilters(){
 $('filters').innerHTML=Object.entries(dims).map(([key,label])=>`<details class="filter" id="filter-${key}"><summary>${label}: todos</summary><div class="choices"><input type="search" placeholder="Buscar ${label.toLowerCase()}…" aria-label="Buscar ${label}" data-find="${key}"><div class="choices-actions"><button data-all="${key}">Todos</button><button data-close="${key}">Cerrar</button></div>${key==='semana'?'<div class="week-controls"><input id="week-from" type="number" min="1" max="53" value="1" aria-label="Semana inicial"><span>a</span><input id="week-to" type="number" min="1" max="53" value="35" aria-label="Semana final"><button id="week-apply">Aplicar rango</button></div>':''}<div class="choices-list">${values(key).map((v,i)=>`<label data-option="${esc(v)}"><input type="checkbox" data-key="${key}" data-index="${i}">${esc(v)}</label>`).join('')}</div></div></details>`).join('');
 document.querySelectorAll('[data-key]').forEach(el=>el.onchange=()=>{const key=el.dataset.key,v=values(key)[Number(el.dataset.index)];el.checked?state.selected[key].add(v):state.selected[key].delete(v);updateFilterLabels();refresh();});
 document.querySelectorAll('[data-find]').forEach(el=>el.oninput=()=>{el.closest('.choices').querySelectorAll('label').forEach(l=>l.hidden=!l.dataset.option.toLowerCase().includes(el.value.toLowerCase()));});
 document.querySelectorAll('[data-all]').forEach(el=>el.onclick=()=>{state.selected[el.dataset.all].clear();syncFilters();refresh();});
 document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>{$(`filter-${el.dataset.close}`).open=false;});
 $('week-from').value=Math.min(...values('semana'));$('week-to').value=Math.max(...values('semana'));
 $('week-apply').onclick=()=>{const from=Number($('week-from').value),to=Number($('week-to').value);if(!Number.isInteger(from)||!Number.isInteger(to)||from>to||from<1||to>53)return;state.selected.semana=new Set(Array.from({length:to-from+1},(_,i)=>from+i));syncFilters();refresh();};
}
function updateFilterLabels(){for(const [key,label]of Object.entries(dims)){const chosen=state.selected[key];$(`filter-${key}`).querySelector('summary').textContent=`${label}: ${chosen.size?(chosen.size===1?[...chosen][0]:chosen.size+' seleccionados'):'todos'}`;}}
function syncFilters(){document.querySelectorAll('[data-key]').forEach(el=>el.checked=state.selected[el.dataset.key].has(values(el.dataset.key)[Number(el.dataset.index)]));updateFilterLabels();}
function filterRows(){return DATA.rows.filter(r=>Object.keys(dims).every(k=>!state.selected[k].size||state.selected[k].has(r[k]))&&(state.includeRecovered||r.estado!=='unido_variedad')&&(!state.completeOnly||control.get(`${r.anio}-${r.semana}`)?.estado_semana==='completa'));}
function aggregate(rows,keys=[]){
 const groups=new Map();if(!keys.length)groups.set('[]',{values:[],rows:[]});
 for(const r of rows){const vals=keys.map(k=>r[k]),id=JSON.stringify(vals);if(!groups.has(id))groups.set(id,{values:vals,rows:[]});groups.get(id).rows.push(r);}
 const totalError=rows.reduce((s,r)=>s+(r.error_absoluto??0),0);
 return [...groups.values()].map(g=>{
  const out=Object.fromEntries(keys.map((k,i)=>[k,g.values[i]])),rs=g.rows,valid=rs.filter(r=>!r.cantidad_por_revisar);
  const sum=k=>valid.length?valid.reduce((s,r)=>s+r[k],0):null;
  const est=sum('tallos_estimados'),real=sum('tallos_reales'),err=sum('error_absoluto');
  return {...out,registros:rs.length,comparaciones:valid.length,por_revisar:rs.length-valid.length,tallos_estimados:est,tallos_reales:real,diferencia_tallos:valid.length?est-real:null,error_absoluto_total:err,MAE_tallos:valid.length?err/valid.length:null,WAPE_pct:real>0?100*err/real:null,sesgo_pct:real>0?100*(est-real)/real:null,participacion_error_pct:totalError>0&&valid.length?100*err/totalError:null,sobreestimacion_tallos:valid.length?valid.reduce((s,r)=>s+Math.max(r.diferencia_tallos,0),0):null,subestimacion_tallos:valid.length?valid.reduce((s,r)=>s+Math.max(-r.diferencia_tallos,0),0):null,solo_estimado:rs.filter(r=>r.estado==='solo_estimado').length,solo_produccion:rs.filter(r=>r.estado==='solo_produccion').length,sin_contraparte_con_volumen:rs.filter(r=>['solo_estimado','solo_produccion'].includes(r.estado)&&(r.tallos_estimados??0)+(r.tallos_reales??0)>0).length,sin_contraparte_cero:rs.filter(r=>['solo_estimado','solo_produccion'].includes(r.estado)&&!r.cantidad_por_revisar&&r.tallos_estimados+r.tallos_reales===0).length,unido_variedad:rs.filter(r=>r.estado==='unido_variedad').length};
 });
}
function titleGroup(r,keys){return keys.map(k=>r[k]).join(' · ');}
function metricSelect(){return `<label>Ordenar gráfica por <select id="chart-metric">${['error_absoluto_total','WAPE_pct','MAE_tallos','tallos_reales'].map(k=>`<option value="${k}" ${state.metric===k?'selected':''}>${labels[k]}</option>`).join('')}</select></label>`;}
function bars(rows,keys){
 const metric=state.metric,top=[...rows].filter(r=>r[metric]!==null&&Number.isFinite(r[metric])).sort((a,b)=>b[metric]-a[metric]).slice(0,10),max=Math.max(...top.map(r=>r[metric]),1);
 return top.length?`<div class="muted">Diez grupos con mayor ${esc(labels[metric].toLowerCase())}. Consulta todos en la tabla.</div>`+top.map(r=>`<div class="bar-row"><span class="bar-label" title="${esc(titleGroup(r,keys))}">${esc(titleGroup(r,keys))}</span><div class="track"><div class="fill" style="width:${100*r[metric]/max}%"></div></div><span class="bar-number">${fmt(r[metric],metric.endsWith('_pct'))}${metric.endsWith('_pct')?' %':''}</span></div>`).join(''):'<div class="empty">Sin valores definidos para esta gráfica.</div>';
}
function lineChart(rows,wape=false){
 if(!rows.length)return '<div class="empty">No hay semanas en la selección.</div>';
 const series=wape?[['WAPE_pct','WAPE','#14796b']]:[['tallos_estimados','Estimado','#d67e43'],['tallos_reales','Real','#14796b']];
 const W=800,H=250,left=66,right=20,top=20,bottom=40,max=Math.max(1,...rows.flatMap(r=>series.map(([k])=>r[k]??0)))*1.12;
 const x=i=>left+(rows.length===1?0.5:i/(rows.length-1))*(W-left-right),y=n=>H-bottom-n/max*(H-top-bottom);
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${wape?'WAPE semanal':'Estimado y producción semanal'}">`;
 for(let i=0;i<5;i++){const v=max*i/4,yy=y(v);svg+=`<line x1="${left}" x2="${W-right}" y1="${yy}" y2="${yy}" stroke="#dce4df"/><text x="${left-8}" y="${yy+4}" text-anchor="end" fill="#657873" font-size="10">${wape?fmt(v)+'%':fmt(v/1000)+' mil'}</text>`;}
 rows.forEach((r,i)=>{const step=Math.max(1,Math.ceil(rows.length/9));if(i===rows.length-1||(i%step===0&&i<rows.length-Math.ceil(step/2)))svg+=`<text x="${x(i)}" y="${H-14}" text-anchor="middle" fill="#657873" font-size="10">${r.anio} S${r.semana}</text>`;});
 for(const[k,label,color]of series){let path='',started=false;rows.forEach((r,i)=>{if(r[k]===null){started=false;return;}path+=`${started?'L':'M'}${x(i)},${y(r[k])} `;started=true;});svg+=`<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>`;rows.forEach((r,i)=>{if(r[k]!==null)svg+=`<circle cx="${x(i)}" cy="${y(r[k])}" r="3" fill="${color}"><title>${esc(label)} · ${r.anio} S${r.semana}: ${fmt(r[k],wape)}${wape?' %':' tallos'}</title></circle>`;});}
 return svg+'</svg><div class="legend">'+series.map(([,l,c])=>`<span><i class="dot" style="background:${c}"></i>${l}</span>`).join('')+'</div>';
}
const standardColumns=['tallos_estimados','tallos_reales','diferencia_tallos','error_absoluto_total','WAPE_pct','MAE_tallos','sesgo_pct','participacion_error_pct','comparaciones','solo_estimado','solo_produccion','sin_contraparte_con_volumen','sin_contraparte_cero','unido_variedad','por_revisar'];
function tableShell(title){return `<section class="panel"><div class="toolbar"><h2>${title}</h2><div><input id="table-search" class="table-search" type="search" placeholder="Buscar filas en esta tabla…" aria-label="Buscar filas"><button id="csv">Descargar tabla filtrada · CSV</button></div></div><div class="muted">Haz clic en una columna para ordenar. La búsqueda de texto solo afecta esta tabla y su CSV.</div><div id="table" class="table-wrap"></div><div class="pager"><span id="page-info"></span><div><button id="prev">Anterior</button> <button id="next">Siguiente</button></div></div></section>`;}
function displayValue(value,key){if(value===null||value===undefined)return '—';if(typeof value==='boolean')return value?'Sí':'No';if(typeof value==='number')return fmt(value,key.endsWith('_pct')||key==='MAE_tallos');return esc(key==='estado'?(stateLabels[value]??value):value);}
function tableRows(){let rows=currentTable.filter(r=>!state.search||currentColumns.some(k=>String(k==='estado'?(stateLabels[r[k]]??r[k]):r[k]??'').toLowerCase().includes(state.search.toLowerCase())));return [...rows].sort((a,b)=>{const av=a[state.sort],bv=b[state.sort];if(av==null)return bv==null?0:1;if(bv==null)return -1;const cmp=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'es');return state.desc?-cmp:cmp;});}
function drawTable(){
 const rows=tableRows(),size=40,maxPage=Math.max(0,Math.ceil(rows.length/size)-1);state.page=Math.min(state.page,maxPage);
 const shown=rows.slice(state.page*size,(state.page+1)*size);
 $('table').innerHTML=shown.length?'<table><thead><tr>'+currentColumns.map(k=>`<th class="${k.startsWith('k_')||k==='estado'?'text':''}"><button data-sort="${k}">${esc(labels[k]??k)} ${state.sort===k?(state.desc?'↓':'↑'):''}</button></th>`).join('')+'</tr></thead><tbody>'+shown.map(r=>'<tr>'+currentColumns.map(k=>`<td class="${typeof r[k]!=='number'?'text':''} ${k==='diferencia_tallos'?(r[k]<0?'negative':r[k]>0?'positive':''):''}">${displayValue(r[k],k)}</td>`).join('')+'</tr>').join('')+'</tbody></table>':'<div class="empty">No hay registros para esta selección.</div>';
 $('page-info').textContent=`${fmt(rows.length)} filas · página ${state.page+1} de ${maxPage+1}`;
 $('prev').disabled=state.page===0;$('next').disabled=state.page>=maxPage;
 document.querySelectorAll('[data-sort]').forEach(el=>el.onclick=()=>{const k=el.dataset.sort;state.desc=state.sort===k?!state.desc:true;state.sort=k;drawTable();});
}
function csvText(rows,columns){const cell=v=>{let s=v==null?'':String(v);if(typeof v==='string'&&/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};return '\ufeff'+[columns,...rows.map(r=>columns.map(k=>typeof r[k]==='number'?String(r[k]).replace('.',','):r[k]))].map(row=>row.map(cell).join(';')).join('\r\n');}
function wireTable(){
 $('table-search').value=state.search;$('table-search').oninput=e=>{state.search=e.target.value;state.page=0;drawTable();};
 $('prev').onclick=()=>{state.page--;drawTable();};$('next').onclick=()=>{state.page++;drawTable();};
 $('csv').onclick=()=>{const blob=new Blob([csvText(tableRows(),currentColumns)],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`benchmark_${state.tab}_filtrado.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};drawTable();
}
function renderContent(){
 const rows=currentRows,weekly=aggregate(rows,['anio','semana']).sort((a,b)=>a.anio-b.anio||a.semana-b.semana);
 if(state.tab==='metodo'){$('content').innerHTML='<section class="panel"><h2>Cómo leer este informe</h2>'+DATA.notas.map(([k,v])=>`<div class="method"><strong>${esc(k)}</strong><div>${esc(v)}</div></div>`).join('')+'<p class="muted">Las métricas describen diferencias respecto a la producción registrada; por sí solas no identifican sus causas.</p></section>';return;}
 if(state.tab==='resumen'){
  currentTable=aggregate(rows,['k_producto']);currentColumns=['k_producto',...standardColumns];
  const top=[...currentTable].sort((a,b)=>(b.error_absoluto_total??0)-(a.error_absoluto_total??0))[0],s=aggregate(rows)[0];
  $('content').innerHTML=`<div class="split"><section class="panel chart"><h2>Estimado frente a producción</h2><p class="muted">Totales semanales de las filas evaluables seleccionadas.</p>${lineChart(weekly)}</section><section class="panel"><h2>Lectura de la selección</h2><div class="insight"><span class="muted">Dirección del desvío neto</span><strong>${s.diferencia_tallos==null?'Sin comparaciones':s.diferencia_tallos>0?'Sobreestimación':s.diferencia_tallos<0?'Subestimación':'Sin diferencia neta'} · ${fmt(s.diferencia_tallos==null?null:Math.abs(s.diferencia_tallos))} tallos</strong></div><div class="insight"><span class="muted">Producto con mayor error absoluto</span><strong>${esc(top?.k_producto??'Sin datos')}</strong>${fmt(top?.participacion_error_pct,true)} % del error de la selección</div><div class="insight"><span class="muted">Sin contraparte</span><strong>${fmt(s.sin_contraparte_con_volumen)} registros con volumen positivo</strong>${fmt(s.sin_contraparte_cero)} registros con volumen cero</div><div class="muted">El desvío neto puede compensar excesos y faltantes; WAPE y MAE conservan ambos errores.</div></section></div><section class="panel chart" style="margin-bottom:16px"><div class="toolbar"><h2>Dónde se concentra el error</h2>${metricSelect()}</div>${bars(currentTable,['k_producto'])}</section>${tableShell('Resultados por producto')}`;
 }else if(state.tab==='semanas'){
  currentTable=weekly.map(r=>({...r,...(control.get(`${r.anio}-${r.semana}`)??{estado_semana:'sin_control_guardado'})}));currentColumns=['anio','semana',...standardColumns,'estado_semana','fechas_faltantes'];
  $('content').innerHTML=`<div class="split"><section class="panel chart"><h2>Volumen semanal</h2>${lineChart(weekly)}</section><section class="panel chart"><h2>WAPE semanal</h2>${lineChart(weekly,true)}</section></div>${tableShell('Resultados por semana')}`;
 }else if(state.tab==='detalle'){
  const s=aggregate(rows)[0];currentTable=rows;currentColumns=['anio','semana','k_finca','k_producto','k_color','k_variedad','estado','tallos_estimados_original','tallos_reales_original','tallos_estimados','tallos_reales','diferencia_tallos','error_absoluto','cero_estimado_por_union','cero_real_por_union','cantidad_por_revisar'];
  $('content').innerHTML=`<section class="panel" style="margin-bottom:16px"><h2>Cobertura de las fuentes</h2><p>${fmt(s.solo_estimado)} registros solo en estimado · ${fmt(s.solo_produccion)} solo en producción · ${fmt(s.unido_variedad)} unidos sin comparar color.</p><p class="muted">Sin contraparte con volumen positivo: ${fmt(s.sin_contraparte_con_volumen)}. Sin contraparte con volumen cero: ${fmt(s.sin_contraparte_cero)}. Cantidades aún desconocidas: ${fmt(s.por_revisar)}. Los originales permanecen disponibles en la tabla.</p></section>${tableShell('Detalle completo de la selección')}`;
 }else{
  const configs={fincas:{title:'Resultados por finca',keys:['k_finca'],cross:['k_finca','k_producto'],crossLabel:'Finca y producto'},productos:{title:'Resultados por producto',keys:['k_producto'],cross:['k_producto','k_finca'],crossLabel:'Producto y finca'},colores:{title:'Resultados por color',keys:['k_color'],cross:['k_producto','k_color'],crossLabel:'Producto y color'},variedades:{title:'Resultados por variedad',keys:['k_producto','k_variedad'],cross:['k_finca','k_producto','k_color','k_variedad'],crossLabel:'Finca, producto, color y variedad'}};
  const c=configs[state.tab],keys=state.cross==='cruce'?c.cross:c.keys;currentTable=aggregate(rows,keys);currentColumns=[...keys,...standardColumns];
  $('content').innerHTML=`<section class="panel chart" style="margin-bottom:16px"><div class="toolbar"><h2>${c.title}</h2><div><select id="cross" aria-label="Nivel de desglose"><option value="principal">Vista principal</option><option value="cruce" ${state.cross==='cruce'?'selected':''}>${c.crossLabel}</option></select> ${metricSelect()}</div></div>${state.tab==='colores'?'<p class="muted">El color de las uniones por variedad prioriza el del estimado. Usa el filtro superior para excluir esas uniones.</p>':''}${bars(currentTable,keys)}</section>${tableShell('Tabla de resultados')}`;
  $('cross').onchange=e=>{state.cross=e.target.value;state.page=0;renderContent();};
 }
 if($('chart-metric'))$('chart-metric').onchange=e=>{state.metric=e.target.value;renderContent();};
 wireTable();
}
function refresh(){
 state.page=0;currentRows=filterRows();const s=aggregate(currentRows)[0];
 const weeks=[...new Set(currentRows.map(r=>`${r.anio}-${r.semana}`))],flagged=weeks.filter(k=>control.has(k)&&control.get(k).estado_semana!=='completa'),unknown=weeks.filter(k=>!control.has(k));
 const filterText=Object.entries(dims).filter(([k])=>state.selected[k].size).map(([k,l])=>`${l}: ${[...state.selected[k]].join(', ')}`).join(' · ');
 $('context').textContent=`${fmt(currentRows.length)} de ${fmt(DATA.rows.length)} registros · ${weeks.length} semanas · ${filterText||'Todas las fincas, productos, colores y variedades'}${state.includeRecovered?'':' · Sin uniones por variedad'}${state.completeOnly?' · Solo semanas completas según control guardado':''}`;
 const notices=[];
 if(s.unido_variedad)notices.push(`${fmt(s.unido_variedad)} registros unidos sin comparar color: el color mostrado prioriza el del estimado. Puedes excluirlos con el filtro superior.`);
 if(flagged.length)notices.push(`Control guardado: ${flagged.length} semanas por revisar (${flagged.map(k=>k.replace('-',' S')).join(', ')}). Una fecha sin producción registrada puede corresponder a un festivo o a datos incompletos.`);
 if(unknown.length)notices.push(`${unknown.length} semanas sin control guardado. Su integridad no se puede verificar con este Excel.`);
 if(s.por_revisar)notices.push(`${fmt(s.por_revisar)} registros conservados en el detalle y excluidos de las métricas por cantidades desconocidas.`);
 if(!currentRows.length)notices.push('No hay registros para la combinación de filtros seleccionada.');
 $('notices').innerHTML=notices.map(n=>`<div class="notice">${esc(n)}</div>`).join('');
 const cards=[['Estimado',s.tallos_estimados,'Tallos evaluados'],['Producción real',s.tallos_reales,'Tallos evaluados'],['Diferencia neta',s.diferencia_tallos,'Estimado − real'],['Error absoluto',s.error_absoluto_total,'Sin compensar excesos y faltantes'],['WAPE',s.WAPE_pct,'Error absoluto / producción real'],['MAE',s.MAE_tallos,'Tallos por registro evaluado']];
 $('kpis').innerHTML=cards.map(([label,n,note])=>`<div class="kpi"><label>${label}</label><strong>${fmt(n,label==='WAPE'||label==='MAE')}${label==='WAPE'&&n!==null?' %':''}</strong><small>${note}</small></div>`).join('');
 renderContent();
}
function setTab(tab){state.tab=tab;state.search='';state.page=0;state.cross='principal';state.sort=tab==='detalle'?'error_absoluto':tab==='semanas'?'semana':'error_absoluto_total';state.desc=tab!=='semanas';document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-pressed',b.dataset.tab===tab);});renderContent();}
$('tabs').innerHTML=tabs.map(([key,label])=>`<button data-tab="${key}" class="${key==='resumen'?'active':''}" aria-pressed="${key==='resumen'}">${label}</button>`).join('');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('include-recovered').onchange=e=>{state.includeRecovered=e.target.checked;refresh();};
$('complete-only').onchange=e=>{state.completeOnly=e.target.checked;refresh();};
$('reset').onclick=()=>{for(const key of Object.keys(dims))state.selected[key].clear();state.includeRecovered=true;state.completeOnly=false;state.search='';$('include-recovered').checked=true;$('complete-only').checked=false;document.querySelectorAll('[data-find]').forEach(e=>{e.value='';e.dispatchEvent(new Event('input'));});syncFilters();refresh();};
document.addEventListener('click',e=>{document.querySelectorAll('.filter[open]').forEach(d=>{if(!d.contains(e.target))d.open=false;});});
$('source-date').textContent=`Generado: ${DATA.meta.generado}`;
$('footer').textContent=`Fuente: ${DATA.meta.fuente} · SHA-256: ${DATA.meta.sha256} · Control: ${DATA.meta.control_fuente}. El Excel descargable contiene el periodo completo; los CSV reflejan la tabla y los filtros actuales. Informe local: no requiere conexión.`;
buildFilters();refresh();
window.benchmark={aggregate,filterRows,state,refresh,setTab,csvText,get rows(){return currentRows;},get table(){return currentTable;}};
</script>
</body>
</html>
